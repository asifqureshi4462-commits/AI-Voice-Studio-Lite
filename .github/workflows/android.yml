name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Ensure Valid Gradle Wrapper Jar
        run: |
          mkdir -p gradle/wrapper
          JAR_PATH="gradle/wrapper/gradle-wrapper.jar"
          NEEDS_DOWNLOAD=0
          if [ ! -s "$JAR_PATH" ]; then
            echo "gradle-wrapper.jar missing or empty."
            NEEDS_DOWNLOAD=1
          elif ! unzip -t "$JAR_PATH" > /dev/null 2>&1; then
            echo "gradle-wrapper.jar exists but is corrupted (fails zip integrity check)."
            NEEDS_DOWNLOAD=1
          fi

          if [ "$NEEDS_DOWNLOAD" = "1" ]; then
            echo "Downloading a fresh, valid gradle-wrapper.jar..."
            curl -fsSL -o "$JAR_PATH" https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
            if ! unzip -t "$JAR_PATH" > /dev/null 2>&1; then
              echo "ERROR: Downloaded gradle-wrapper.jar is still invalid."
              exit 1
            fi
            echo "gradle-wrapper.jar is now valid."
          else
            echo "Existing gradle-wrapper.jar is valid, keeping it."
          fi
          echo "Final gradle-wrapper.jar size: $(wc -c < "$JAR_PATH") bytes"

      - name: Verify Gradle Version
        run: ./gradlew --version

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
