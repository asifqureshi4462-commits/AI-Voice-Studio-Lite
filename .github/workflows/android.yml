name: Android CI & Release Build

on:
  push:
    branches:
      - "main"
      - "master"

  pull_request:
    branches:
      - "main"
      - "master"

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 3. Give Gradle wrapper execute permission
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. Ensure Gradle Wrapper JAR exists
      - name: Ensure Valid Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          JAR_PATH="gradle/wrapper/gradle-wrapper.jar"
          
          # Check if JAR file exists and has valid size
          if [ ! -f "$JAR_PATH" ] || [ $(wc -c < "$JAR_PATH") -lt 50000 ]; then
            echo "Downloading valid Gradle Wrapper JAR (v8.5.0)..."
            curl -sSL -o "$JAR_PATH" https://services.gradle.org/distributions/gradle-8.5-wrapper.jar
            
            # Verify the download
            JAR_SIZE=$(wc -c < "$JAR_PATH")
            echo "Gradle Wrapper JAR size: $JAR_SIZE bytes"
            
            if [ "$JAR_SIZE" -lt 50000 ]; then
              echo "ERROR: Downloaded JAR is too small. Download may have failed."
              exit 1
            fi
            echo "✓ Gradle Wrapper JAR validated successfully"
          else
            echo "✓ Gradle Wrapper JAR already exists and is valid"
          fi

      # 5. Check Gradle wrapper files
      - name: Check Gradle Wrapper
        run: |
          echo "================ GRADLE WRAPPER CHECK ================"
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle wrapper directory:"
          ls -la gradle/wrapper/ 2>/dev/null || true

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true

          echo ""
          echo "Gradlew:"
          ls -lh gradlew

          echo "========================================================"

      # 6. Verify Gradle
      - name: Verify Gradle Version
        run: |
          ./gradlew --version

      # 7. Build diagnostics
      - name: Print Build Diagnostics & UI Resource Integrity
        run: |
          echo "================ BUILD DIAGNOSTICS ================"

          echo "Commit SHA      : ${{ github.sha }}"
          echo "Branch / Ref    : ${{ github.ref }}"
          echo "Workflow Run    : ${{ github.run_number }}"

          echo ""
          echo "Java Version:"
          java -version

          echo ""
          echo "Gradle Version:"
          ./gradlew --version

          echo ""
          echo "Build Variant: Release (assembleRelease)"

          echo ""
          echo "================ UI RESOURCE INTEGRITY ================"

          echo "Layout files:"
          ls -la app/src/main/res/layout/ 2>/dev/null || echo "No layout directory"

          echo ""
          echo "Values files:"
          ls -la app/src/main/res/values/ 2>/dev/null || echo "No values directory"

          echo ""
          echo "Assets:"
          ls -la app/src/main/assets/ 2>/dev/null || echo "No assets directory"

          echo ""
          echo "Release resource overrides:"
          ls -la app/src/release/res/ 2>/dev/null || echo "No release resource overrides"

          echo ""
          echo "Debug resource overrides:"
          ls -la app/src/debug/res/ 2>/dev/null || echo "No debug resource overrides"

          echo "======================================================="

      # 8. Clean project
      - name: Clean Project
        run: |
          ./gradlew clean --stacktrace

      # 9. Build Release APK
      - name: Build Android Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      # 10. Check generated APK
      - name: Verify APK Output
        run: |
          echo "================ APK OUTPUT ================"

          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            echo "APK successfully generated:"
            ls -lh app/build/outputs/apk/release/*.apk
          else
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "============================================"

      # 11. Upload APK
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14